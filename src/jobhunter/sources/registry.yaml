  verified: "2026-10-09"
  family_signals: ["/vosnet/ in entry URL"]
  rate_limit: {rps: 0.2, concurrency: 1, jitter: true}
  robots: {status: "disallow_all", checked: "2026-10-09", note: "User-agent * Disallow: /"}
