- key: "mi-mitalent"
  state: "MI"
  class: "A"
  name: "Michigan's Talent Bank"
  family: "htmlconfig"
  tier: "http"
  entry: "https://www.mitalent.org/"
  verified: "2026-10-09"
  family_signals: ["Orchard CMS front (meta generator)", "job search on jobs.mitalent.org/job-search (ASP.NET WebForms, __VIEWSTATE, __doPostBack paging)", "anonymous detail pages /job-seeker/job-details/JobCode/<id>"]
  config:
    base_url: "https://jobs.mitalent.org"
    timezone: "America/Detroit"
    date_formats: ["%m/%d/%Y"]
    search:
      method: "POST"
      days_buckets: [1, 7, 14, 30]
      default_days: 30
      form:
        path: "/job-search"
        selector: "form#JobSearch"
        submit: {"ctl00$ctl00$MainContent$MainContentSub$submitBtn2": "Search"}
      data:
        "ctl00$ctl00$MainContent$MainContentSub$job_keywords": "{query}"
        "ctl00$ctl00$MainContent$MainContentSub$job_time_range": "{posted_within_days}"
    list:
      rows: "div.result-title"
      row_siblings: true
      id: {sel: "a::attr(name)"}
      title: "a::text"
      url: "a::attr(href)"
      employer: {sel: "span.search_results_employer::own", re: "^(.*?)\\s+-\\s"}
      location: {sel: "span.search_results_employer::own", re: "-\\s+([^-]+?,\\s*[A-Z]{2}\\b[^-]*?)\\s*-\\s*Posted"}
      posted_at: {sel: "span.search_results_employer::own", re: "Posted\\s+(\\S+)"}
    detail:
      title: "#MainContent_lblJobTitle::text"
      description: "#MainContent_lblJobDescription::html"
      employer: "#MainContent_lblEmpName::text"
      location: "#MainContent_lblLocation::text"
      closes_at: "#MainContent_lblExpirationDate::text"
      posted_at: "#MainContent_hdPostedDate::attr(value)"
      apply_url: "#MainContent_ApplyInfo a::attr(href)"
  pagination: {kind: "postback", max_pages: 4, page_size: 25, form: "form#JobSearchResults", target: "ctl00$MainContent$pageTop{page}", argument: ""}
  rate_limit: {rps: 0.2, concurrency: 1, jitter: true}
  robots: {status: "partial", checked: "2026-10-09", note: "Rechecked 2026-10-09: jobs.mitalent.org/robots.txt disallows only /Feedback/ and /bot-trap/ (plus named scraper bots); the sitemap index is advertised. Search, results paging and detail pages are all anonymous."}
  policy: "enabled"
  queries: "from_profile"
  expect: {min_jobs_per_week: 0}

