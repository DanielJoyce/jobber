{% extends "base.html" %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', path='prefs.css') }}">{% endblock %}
{% block main %}
<h1>Preferences</h1>
<div class="banner banner-error" role="alert">
  <strong>The profile could not be loaded.</strong> Fix <code>profile/preferences.yaml</code> (or the resume it points to) by hand, then reload.
  <div class="muted">{{ error }}</div>
</div>
<p><a class="button" href="/prefs">Reload</a></p>
{% endblock %}
