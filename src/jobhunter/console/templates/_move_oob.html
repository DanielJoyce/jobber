<article id="card-{{ c.app_id }}" hx-swap-oob="delete"></article>
{# htmx inserts the *children* of a non-"true" OOB element, so the card needs a wrapper. #}
<div hx-swap-oob="beforeend:#cards-{{ lane }}">{% set oob_card = none %}{% include "_card.html" %}</div>
{% for l in [old_lane, lane] | unique %}
<span class="count" id="count-{{ l }}" hx-swap-oob="true">{{ counts[l] }}</span>
{% endfor %}
