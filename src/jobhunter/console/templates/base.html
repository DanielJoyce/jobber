<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %} - jobhunter</title>
  <script>
    try {
      var t = localStorage.getItem("jh-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  <script src="{{ static_url('vendor/htmx-2.0.4.min.js') }}" defer></script>
  <script src="{{ static_url('app.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">jobhunter</a>
    <nav aria-label="Main">
      {% for path, label in nav %}
      <a href="{{ path }}"{% if path == active %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">&#9680; theme</button>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
</body>
</html>
