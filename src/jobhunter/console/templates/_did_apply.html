{% if prompt %}
<div class="banner did-apply" id="did-apply" role="status">
  <strong>Did you apply?</strong>
  <button type="button" class="act" hx-post="/job/{{ group_id }}/applied?choice=yes" hx-target="#did-apply" hx-swap="outerHTML">Yes</button>
  <button type="button" class="act" hx-post="/job/{{ group_id }}/applied?choice=not_yet" hx-target="#did-apply" hx-swap="outerHTML">Not yet</button>
  <button type="button" class="act" hx-post="/job/{{ group_id }}/applied?choice=not_interested" hx-target="#did-apply" hx-swap="outerHTML">Not interested</button>
</div>
{% endif %}
