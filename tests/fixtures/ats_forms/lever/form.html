<!doctype html>
<html><head><title>Acme Synthetic - Synthetic Engineer</title></head>
<body>
<div class="posting-header"><h2>Synthetic Engineer</h2>
  <a class="postings-btn template-btn-submit" href="apply">Apply for this job</a></div>
<div class="application-page">
<form id="application-form" method="POST" enctype="multipart/form-data">
  <ul>
    <li class="application-question resume"><label>Resume/CV</label>
      <input id="resume-upload-input" type="file" name="resume">
      <span class="resume-upload-working">Parsing...</span></li>
    <li><label>Full name</label><input type="text" name="name"></li>
    <li><label>Email</label><input type="email" name="email"></li>
    <li><label>Phone</label><input type="text" name="phone"></li>
    <li><label>Current location</label><input type="text" name="location"></li>
    <li><label>Current company</label><input type="text" name="org"></li>
    <li><label>LinkedIn URL</label><input type="text" name="urls[LinkedIn]"></li>
    <li><label>GitHub URL</label><input type="text" name="urls[GitHub]"></li>
    <li><label>Portfolio URL</label><input type="text" name="urls[Portfolio]"></li>
    <li><label>Other website</label><input type="text" name="urls[Other]"></li>
    <li><label>Additional information</label><textarea name="comments"></textarea></li>
  </ul>
  <button type="button" class="template-btn-utility">Clear</button>
  <button id="btn-submit" type="submit" class="template-btn-submit">Submit application</button>
</form>
</div>
</body></html>
