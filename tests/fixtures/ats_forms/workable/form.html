<!doctype html>
<html><head><title>Synthetic Engineer - Acme Synthetic</title></head>
<body>
<a data-ui="overview-apply-now" href="apply/">Apply for this job</a>
<form data-ui="application-form">
  <label for="firstname">First name</label><input id="firstname" name="firstname" type="text">
  <label for="lastname">Last name</label><input id="lastname" name="lastname" type="text">
  <label for="email">Email</label><input id="email" name="email" type="email">
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="address">Address</label><input id="address" name="address" type="text">
  <label>Resume</label><input data-ui="resume" type="file">
  <button type="button" data-ui="upload-button">Upload a file</button>
  <label for="cover_letter">Cover letter</label>
  <textarea id="cover_letter" name="cover_letter"></textarea>
  <button type="submit" data-ui="apply-button">Submit application</button>
</form>
</body></html>
