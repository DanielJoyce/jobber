<!doctype html>
<html><head><title>Synthetic Engineer at Acme Synthetic</title></head>
<body>
<div class="job__header"><h1>Synthetic Engineer</h1>
  <button type="button" class="btn">Apply</button></div>
<a href="#app" class="skip">Apply for this job</a>
<div id="app">
  <form id="application-form" class="application--form">
    <div class="input-wrapper"><label for="first_name">First Name*</label>
      <input id="first_name" type="text"></div>
    <div class="input-wrapper"><label for="last_name">Last Name*</label>
      <input id="last_name" type="text"></div>
    <div class="input-wrapper"><label for="preferred_name">Preferred First Name</label>
      <input id="preferred_name" type="text"></div>
    <div class="input-wrapper"><label for="email">Email*</label>
      <input id="email" type="text"></div>
    <div class="input-wrapper"><label for="country">Country</label>
      <input id="country" role="combobox" aria-expanded="false"></div>
    <div class="input-wrapper"><label for="phone">Phone</label>
      <input id="phone" type="tel"></div>
    <div class="input-wrapper"><label for="candidate-location">Location (City)</label>
      <input id="candidate-location" role="combobox" aria-expanded="false"></div>
    <div class="file-upload"><label for="resume">Resume/CV*</label>
      <input id="resume" type="file">
      <button type="button" class="btn btn--tertiary">Attach</button></div>
    <div class="file-upload"><label for="cover_letter">Cover Letter</label>
      <input id="cover_letter" type="file">
      <button type="button" class="btn btn--tertiary">Enter manually</button></div>
    <div class="input-wrapper"><label for="question_1">LinkedIn Profile</label>
      <input id="question_1" type="text"></div>
    <button type="submit" class="btn btn--pill">Submit application</button>
  </form>
</div>
</body></html>
