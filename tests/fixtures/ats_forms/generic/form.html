<!doctype html>
<html><head><title>Careers - Acme Synthetic</title></head>
<body>
<form action="/careers/apply" method="post">
  <label for="a">Given name</label><input id="a" name="fname">
  <label for="b">Surname</label><input id="b" name="lname">
  <label for="c">E-mail address (required)</label><input id="c" name="mail">
  <label for="d">Mobile number</label><input id="d" name="tel">
  <label for="e">State / Province</label><input id="e" name="st">
  <label for="f">LinkedIn profile URL:</label><input id="f" name="li">
  <label for="g">Street address</label><input id="g" name="addr">
  <label for="h">Desired salary</label><input id="h" name="pay">
  <label for="i">Favourite colour</label><input id="i" name="colour">
  <button type="submit">Send application</button>
</form>
</body></html>
