# Copy to ~/.config/jobhunter/config.toml, i.e. $XDG_CONFIG_HOME/jobhunter/config.toml
# (or point $JOBHUNTER_CONFIG at your copy).
# Every value below is the built-in default; uncomment only what you want to change.
# Placeholders only; never commit real values.
# Secrets: ANTHROPIC_API_KEY comes from the environment, never from this file.

[paths]
# Defaults follow the XDG spec; `jobhunter paths` shows what is in effect. Relative paths
# you set here resolve against the directory you run jobhunter from.
# data_dir = "~/.local/share/jobhunter"        # $XDG_DATA_HOME/jobhunter
# cache_dir = "~/.cache/jobhunter"             # $XDG_CACHE_HOME/jobhunter
# db_path = "~/.local/share/jobhunter/jobhunter.db"   # default: <data_dir>/jobhunter.db
# profile_dir = "~/.local/share/jobhunter/profile"    # default: <data_dir>/profile
# resume_path = "~/.local/share/jobhunter/resume"     # a directory or a single file
# The environment wins over this file: JOBHUNTER_DATA_DIR, JOBHUNTER_CACHE_DIR,
# JOBHUNTER_DB_PATH, JOBHUNTER_PROFILE_DIR, JOBHUNTER_RESUME_PATH.

[fetch]
# respect_robots = true
# default_rps = 0.2
# global_concurrency = 8
# parallel_sources = 6     # sources `jobhunter run` fetches at once (at most global_concurrency)
# user_agent_contact = "<you>@example.com"
# timeout_s = 20.0
# max_retries = 5

[scoring]
# Scorer specs are "<provider>:<model>" (a bare model name is not accepted). A malformed
# screen_scorer is reported by the run, score and console and scoring is skipped; fetch and
# mail still run. deep_scorer must be anthropic:<model>. Changing them needs a console restart.
#   anthropic:<model>       Anthropic batch API; ANTHROPIC_API_KEY
#   openrouter:<slug>       OpenRouter chat completions; OPENROUTER_API_KEY, [scoring.openrouter]
#   jev:<slug>              OpenRouter decisions endpoint; same key and section as openrouter,
#   decisions:<slug>          but its own provider: write jev:typesafe/jev-1.13, never
#                             openrouter:jev:...
#   local:<model>           a model on this machine; [scoring.local]
#   openai-compat:<model>   any OpenAI-compatible endpoint; [scoring.openai_compat]
# screen_scorer = "jev:typesafe/jev-1.13"
# screen_scorer = "openrouter:openai/gpt-oss-120b"
# screen_scorer = "anthropic:claude-haiku-5-5"
# deep_scorer = "anthropic:claude-opus-5-5"
# daily_cap_usd = 2.0
# weekly_cap_usd = 10.0
# deep_shortlist = 40
# employer_rejection_days = 90   # tell the scorer about a recent rejection by the same employer

# Only used when screen_scorer = "openai-compat:<model>". Switching scorer sends your resume
# profile and the postings to base_url (specs/008). The API key is read from the env var named
# here, never from this file. Prices of 0 mean "unknown": cost is recorded as $0.
# [scoring.openai_compat]
# base_url = "http://localhost:8000"          # /v1/chat/completions is appended
# api_key_env = "OPENAI_COMPAT_API_KEY"       # "" sends no Authorization header
# input_usd_per_mtok = 0.0
# output_usd_per_mtok = 0.0
# max_concurrency = 2
# json_schema = true                          # false: instruct JSON instead of response_format

# Only used when screen_scorer = "openrouter:<model-slug>" (specs/016). Key from the env var
# below. The resume goes to openrouter.ai and the provider it routes to, so providers that
# retain prompts are excluded by default. Cost comes from the response, else the model catalog
# cached at catalog_cache (refreshed daily).
# [scoring.openrouter]
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "OPENROUTER_API_KEY"
# title = "jobhunter"                          # X-Title
# referer = ""                                 # HTTP-Referer, omitted when empty
# provider = { require_parameters = true, data_collection = "deny" }
# max_concurrency = 2
# catalog_cache = "~/.cache/jobhunter/openrouter_models.json"   # default: <cache_dir>/openrouter_models.json
# jobs_per_request = 8                         # packed requests (specs/016); 1 = one job each, max 16
# max_input_tokens_per_request = 40000        # split a pack above this estimated input size
# est_cost_per_request_usd = 0.04             # spend-cap estimate until a mean is measured

# Only used when screen_scorer = "local:<model>" (specs/016): a model on this machine behind
# llama.cpp's llama-server or Ollama. Nothing leaves the computer. Set up with
# scripts/setup-local-llm.sh, which asks before installing anything.
# [scoring.local]
# runtime = "llama.cpp"          # "llama.cpp" -> http://127.0.0.1:8080, "ollama" -> http://127.0.0.1:11434/v1
# base_url = ""                  # override the runtime's default URL
# api_key_env = "LLAMA_API_KEY"   # env var with llama-server's --api-key (set by setup-local-llm.sh)
# timeout_s = 900.0              # CPU inference is slow; per-request wait
# max_concurrency = 1            # CPU-bound: one request at a time
# json_schema = true

[mail]
# alerts_address = "<you>+jobs@gmail.com"
# label = "jobhunter/alerts"
# fallback_sender_domains = []    # e.g. ["example-jobs.com"]; never a site that also sends you
#                                 # personal mail (linkedin.com): use fallback_senders instead
# fallback_senders = []           # exact addresses, e.g. LinkedIn's job-alert sender:
#                                 # ["jobalerts-noreply@linkedin.com"]; confirm on a real alert

[console]
# host = "127.0.0.1"
# port = 8808
# public_port = 8808     # the port the browser extension connects to, if it differs

# Assisted apply drafting (specs/017): targeted resume, cover letter, question drafts.
# runner = "cli" runs `claude -p` on your Claude subscription (no API credit) in a scrubbed
# environment with no tools; "api" uses ANTHROPIC_API_KEY. With "cli", a failed run offers the
# API run with its estimate and waits for your click; it never switches by itself.
[apply]
# runner = "cli"
# cli_model = "opus"                 # CLI alias
# api_model = "claude-opus-5-5"      # API model id for the fallback
# effort = "medium"
# daily_cap_usd = 1.00               # packet API spend only; separate from [scoring] caps
# entailment_check = true            # advisory Haiku pass: do the cited lines support each line?

# The nightly run's apply-link pass: after scoring, resolve apply links for shortlisted and
# A/B-fit jobs that have none yet, so Apply opens without waiting. No credits; robots.txt and
# per-host rate limits apply. Skip it once with `jobhunter run --stage` (leave out apply_links).
[apply_links]
# per_run = 200          # groups resolved per run at most; 0 turns the pass off
# workers = 4            # groups resolved at once

[capture]
# Hosts where the browser extension never reads a page (suffix match).
# disabled_hosts = []    # e.g. ["linkedin.com", "indeed.com"]
