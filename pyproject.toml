[project]
name = "jobhunter"
version = "0.1.0"
description = "Single-user job-search system: sweep job banks, score fit, track applications."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "selectolax>=0.3",
    "lxml>=5",
    "rapidfuzz>=3",
    "dateparser>=1.2",
    "ruamel.yaml>=0.18",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "respx>=0.21",
    "pre-commit>=4.6.2",
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: browser end-to-end tests (Playwright/chromium); run with -m e2e"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["jobhunter"]
